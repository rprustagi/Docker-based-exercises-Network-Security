services:
  ha:
    build:
      context: ../df
      dockerfile: ub22-host.df
      target: ub22-host
    image: umbc/csee/cns/ub22-host
    container_name: HA
    hostname: HA
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: none
    command: >
      bash -c "
      mkdir -p /tmp
      && sleep infinity
      "

  hc:
    build:
      context: ../df
      dockerfile: ub22-host.df
      target: ub22-host
    image: umbc/csee/cns/ub22-host
    container_name: HC
