
services:
  Router1:
    build:
      context: ../df
      dockerfile: ub22-router.df
      target: ub22-router
    image: umbc/csee/cns/ub22-router
    container_name: R1
    hostname: R1
    tty: true
    sysctls:
      net.ipv4.ip_forward: "1"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      net4-45:
        ipv4_address: 172.21.45.254
      net4-46:
        ipv4_address: 172.21.46.254
      net4-48:
        ipv4_address: 172.21.48.254
    command: >
      bash -c "
      mkdir -p /tmp
      && ip route delete default
      && ip route add default via 172.21.46.253
      && tail -f /dev/null
      "

  Router2:
    build:
      context: ../df
      dockerfile: ub22-router.df
      target: ub22-router
    image: umbc/csee/cns/ub22-router
    container_name: R2
    hostname: R2
    tty: true
    sysctls:
      net.ipv4.ip_forward: "1"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      net4-46:
        ipv4_address: 172.21.46.253
      net4-47:
        ipv4_address: 172.21.47.254
    command: >
      bash -c "
      mkdir -p /tmp
      && ip route delete default
      && ip route add default via 172.21.46.254
      && tail -f /dev/null
      "

  Host1:
    build:
      context: ../df
      dockerfile: ub22-host.df
      target: ub22-host
    image: umbc/csee/cns/ub22-host
    container_name: HA
    hostname: HA
    tty: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    extra_hosts:
      - "HB:172.21.47.5"
      - "HC:172.21.48.5"
      - "R1:172.21.45.254"
    networks:
      net4-45:
        ipv4_address: 172.21.45.5
    command: >
      bash -c "
      mkdir -p /tmp
      && ip route delete default
      && ip route add default via 172.21.45.254
      && tail -f /dev/null
      "

  Host2:
    build:
      context: ../df
      dockerfile: ub22-host.df
      target: ub22-host
    image: umbc/csee/cns/ub22-host
    container_name: HB
    hostname: HB
    tty: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    extra_hosts:
      - "HA:172.21.45.5"
      - "HC:172.21.48.5"
      - "R2:172.21.47.254"
    networks:
      net4-47:
        ipv4_address: 172.21.47.5
    command: >
      bash -c "
      mkdir -p /tmp
      && ip route delete default
      && ip route add default via 172.21.47.254
      && tail -f /dev/null
                     "

  Host3:
    build:
      context: ../df
      dockerfile: ub22-host.df
      target: ub22-host
    image: umbc/csee/cns/ub22-host
    container_name: HC
    hostname: HC
    tty: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    extra_hosts:
      - "HA:172.21.45.5"
      - "HB:172.21.47.5"
      - "R1:172.21.48.254"
    networks:
      net4-48:
        ipv4_address: 172.21.48.5
    command: >
      bash -c "
      mkdir -p /tmp
      && ip route delete default
      && ip route add default via 172.21.48.254
      && tail -f /dev/null
      "

networks:
  net4-45:
    name: net4-45
    ipam:
      config:
        - subnet: 172.21.45.0/24

  net4-46:
    name: net4-46
    ipam:
      config:
        - subnet: 172.21.46.0/24

  net4-47:
    name: net4-47
    ipam:
      config:
        - subnet: 172.21.47.0/24

  net4-48:
    name: net4-48
    ipam:
      config:
        - subnet: 172.21.48.0/24

